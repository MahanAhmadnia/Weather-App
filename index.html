<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-body-secondary">
    <div class="container mt-4">

        <div class="row justify-content-center">

            <div class="col-10 col-lg-8 col-xl-5 shadow rounded-5 bg-white">

                <h1 class="display-5 text-center align-content-center mt-4 py-2">Weather App</h1>


                <!-- search-box -->

                <div class="d-flex align-items-center justify-content-evenly py-3">

                    <div class="input-group mx-3">

                        <input type="text" class="form-control rounded-pill shadow-sm py-3">

                    </div>

                    <button class="btn btn-outline-primary px-3 py-3 px-sm-4 me-3 rounded-5 shadow-sm">
                        <i class="bi bi-search"></i>
                    </button>

                </div>


                <!-- image -->

                <div class="city my-1 text-center align-content-center">
                    <img src="./images/7133364.png" alt="" width="240px" class="img-fluid">
                </div>


                <!-- tempture-city -->

                <div class="tempture-city text-center align-content-center my-2 py-2">

                    <h2 class="display-6">15 C</h2>
                    
                    <h2 class="display-5">Amestrdom</h2>
                </div>


                <!-- footer -->

                <div class="my-4 d-flex align-items-center justify-content-around">

                    <!-- first -->
                    <div class="d-flex align-items-center justify-content-center my-3">

                        
                        <img src="./images/water_36dp_000000_FILL0_wght400_GRAD0_opsz40.svg" alt="" class="img-fluid mx-3" width="60px">

                        <div>
                            <span>60 </span>%

                            <br>

                            <span>humidiy</span>
                        </div>
                    </div>

                    <!-- twice -->
                    <div class="d-flex align-items-center justify-content-center my-3">

                        <img src="./images/air_36dp_000000_FILL0_wght400_GRAD0_opsz40.svg" alt="" class="img-fluid mx-3" width="60px">

                        <div>
                            <span>15 </span>km/h

                            <br>

                            <span>wind</span>
                        </div>
                        
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./script.js"></script>

    <!-- Bootstrap JS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
