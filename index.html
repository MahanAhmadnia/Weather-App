<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- SEO Meta Tags -->
    <meta name="description" content="A responsive Weather App built with Bootstrap and JavaScript. Easily check real-time temperature, humidity, and wind speed for any city worldwide.">
    <meta name="keywords" content="weather, responsive weather app, Bootstrap 5, JavaScript, Open-Meteo, temperature, humidity, wind speed">
    <meta name="author" content="MahanAhmadnia">
    <meta name="robots" content="index, follow">
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./images/cloud-rain-fill.svg">
    <link rel="apple-touch-icon" href="./images/cloud-rain-fill.svg">
</head>
<body class="bg-body-secondary">
    <div class="container mt-4">

        <div class="row justify-content-center">

            <div class="col-10 col-lg-8 col-xl-5 shadow rounded-5 bg-white">

                <h1 class="display-3 text-center align-content-center mt-4 py-2 fw-medium fs-1">Weather App</h1>


                <!-- search-box & button -->

                <div class="d-flex align-items-center justify-content-evenly py-3 mx-3">

                    <div class="input-group me-2 me-sm-3">

                        <input type="text" id="input" class="form-control rounded-pill shadow-sm py-3 px-4 border-2" placeholder="Enter a city name...">

                    </div>

                    <button id="button" class="btn btn-primary px-4 py-3 px-sm-4 me-2 rounded-pill shadow-sm">
                        <i class="bi bi-search"></i>
                    </button>

                </div>


                <!-- weather-illustration -->

                <div class="city text-center align-content-center">
                    <img src="./images/7133364.png" alt="weather-illustration" width="240px" class="img-fluid">
                </div>


                <!-- temperature-city -->

                <div class="temperature-city text-center align-content-center mb-3">

                    <h2 id="cityTemperature" class="display-6 fw-normal">00 °C</h2>
                    
                    <h2 id="cityName" class="display-6 fw-normal">Your City</h2>
                </div>


                <!-- humidity & wind-speed -->

                <div class="mb-4 mx-3 d-block d-sm-flex align-items-center justify-content-around bg-light rounded-5 py-1">

                    <!-- humidity -->
                    <div class="d-flex align-items-center justify-content-center my-3">

                        
                        <img src="./images/water_36dp_000000_FILL0_wght400_GRAD0_opsz40.svg" alt="humidity-icon" class="img-fluid mx-3" width="50px">

                        <div>
                            <span id="humidity" class="fs-4 fw-medium">00 %</span>

                            <br>

                            <span>Humidity Q</span>
                        </div>
                    </div>

                    <!-- wind-speed -->
                    <div class="d-flex align-items-center justify-content-center my-3">

                        <img src="./images/air_36dp_000000_FILL0_wght400_GRAD0_opsz40.svg" alt="wind-speed-icon" class="img-fluid mx-3" width="50px">

                        <div>
                            <span id="windSpeed" class="fs-4 fw-medium">00 km/h</span>

                            <br>

                            <span>Wind Speed</span>
                        </div>
                        
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./script.js"></script>

    <!-- Bootstrap JS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
