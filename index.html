<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container w-75 mt-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8 col-xl-6 border">

                <h1 class="border text-center align-content-center my-1 py-2">Weather App</h1>

                <div class="search-box d-flex align-items-center justify-content-evenly border py-3">

                    <div class="input-group mx-3">

                        <input type="text" class="form-control rounded-pill">

                    </div>

                    <button class="btn btn-outline-primary mx-3 rounded-pill">
                        <i class="bi bi-search"></i>
                    </button>

                </div>


                <!-- image -->

                <div class="city border my-1 text-center align-content-center">
                    <img src="./images/7133364.png" alt="" width="200px" class="img-fluid">
                </div>


                <!-- tempture-city -->

                <div class="tempture-city text-center align-content-center border my-1">

                    <h2>15 C</h2>
                    
                    <h2>Amestrdom</h2>
                </div>


                <!-- footer -->

                <div class="footer d-flex flex-column flex-sm-row gap-3 gap-sm-0 justify-content-evenly border py-2 my-1">

                    <div class="humidity border d-flex align-items-center justify-content-evenly justify-content-sm-center">

                        <img src="./images/water_36dp_000000_FILL0_wght400_GRAD0_opsz40.png" alt="" class="border" width="50px">

                        <div class="d-flex flex-column align-items-start justify-content-center px-2">

                            <span>60%</span>

                            <span>humidity</span>
                        </div>
                        
                    </div>

                    <div class="wind-speed border d-flex align-items-center justify-content-evenly justify-content-sm-center">

                        <img src="./images/air_36dp_000000_FILL0_wght400_GRAD0_opsz40.png" alt="" class="border" width="50px">

                        <div class="d-flex flex-column align-items-start justify-content-center px-2">

                            <span>60 KM/H</span>

                            <span>wind-speed</span>
                        </div>

                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./script.js"></script>

    <!-- Bootstrap JS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
